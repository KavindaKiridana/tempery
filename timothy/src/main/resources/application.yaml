spring:
  application:
    name: timothy

  # Database connection — like connection string in .NET
  datasource:
    url: jdbc:postgresql://localhost:5432/frame_inventory
    username: postgres
    password: postgres        # ← change this to your PostgreSQL password
    driver-class-name: org.postgresql.Driver

    # Connection pool settings (like ADO.NET connection pooling)
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # Disable JPA/Hibernate completely — we use JDBC Template only
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Server settings
server:
  port: 8080
  servlet:
    context-path: /api       # all endpoints will be /api/...

# Logging
logging:
  level:
    root: INFO
    com.timothy: DEBUG        # show debug logs for your own code
    org.springframework.jdbc: DEBUG  # shows SQL queries being executed
 